name: Build Windows executable

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out official NVIDIA DLSS SDK build files
        uses: actions/checkout@v4
        with:
          repository: NVIDIA/DLSS
          ref: 374959484e79a640feaba44c93ac8cfb0a03f5b5
          path: .deps/nvidia-dlss
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            include/nvsdk_ngx.h
            include/nvsdk_ngx_defs.h
            include/nvsdk_ngx_defs_dlssd.h
            include/nvsdk_ngx_helpers.h
            include/nvsdk_ngx_helpers_dlssd.h
            include/nvsdk_ngx_params.h
            lib/Windows_x86_64/x64/nvsdk_ngx_s.lib
            LICENSE.txt

      - name: Resolve embedded application version
        shell: pwsh
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          $version = "0.0.0-dev"
          if ($env:REF_TYPE -eq "tag" -and $env:REF_NAME -match '^v(?<version>\d+\.\d+\.\d+)$') {
            $version = $Matches.version
          } elseif (
            $env:REF_TYPE -eq "branch" -and
            $env:REF_NAME -eq "main" -and
            $env:COMMIT_MESSAGE -match '@(?<version>\d+\.\d+\.\d+)(?![\d.])'
          ) {
            $version = $Matches.version
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "LS_COMPANION_VERSION=$version"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: companion/requirements.txt

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r companion/requirements.txt "pyinstaller>=6.10,<7"

      - name: Run application tests
        shell: pwsh
        run: |
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { throw "Python tests failed" }
          node tests/check_javascript.js companion/ui/dashboard.html
          if ($LASTEXITCODE -ne 0) { throw "Dashboard JavaScript validation failed" }

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build bundled GPU benchmark
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/native | Out-Null
          cl /nologo /std:c++17 /O2 /EHsc /DUNICODE /D_UNICODE `
            /Fo:build/native/ls_benchmark.obj /Fe:build/native/LSBenchmark.exe `
            benchmark_app/ls_benchmark.cpp `
            d3d11.lib dxgi.lib d3dcompiler.lib user32.lib shell32.lib
          if (-not (Test-Path -LiteralPath build/native/LSBenchmark.exe)) {
            throw "Bundled GPU benchmark was not produced"
          }

      - name: Build bundled ReShade bridge
        shell: pwsh
        run: |
          cmake -S native/reshade_bridge -B build/reshade_bridge -A x64
          cmake --build build/reshade_bridge --config Release
          if (-not (Test-Path -LiteralPath build/native/LSP-ReShade/LSC_ReShadeBridge.dll)) {
            throw "Bundled ReShade bridge was not produced"
          }
          if (-not (Test-Path -LiteralPath build/native/LSP-ReShade/addon.json)) {
            throw "Bundled ReShade bridge manifest was not produced"
          }

      - name: Stage official NVIDIA NGX build dependency
        shell: pwsh
        run: |
          $sdk = Resolve-Path -LiteralPath ".deps/nvidia-dlss" -ErrorAction Stop
          $target = "native/lsp_neuralrender/external/ngx"
          New-Item -ItemType Directory -Force "$target/include", "$target/lib" | Out-Null
          $headers = @(
            "nvsdk_ngx.h",
            "nvsdk_ngx_defs.h",
            "nvsdk_ngx_defs_dlssd.h",
            "nvsdk_ngx_helpers.h",
            "nvsdk_ngx_helpers_dlssd.h",
            "nvsdk_ngx_params.h"
          )
          foreach ($header in $headers) {
            Copy-Item -LiteralPath "$sdk/include/$header" -Destination "$target/include/$header"
          }
          Copy-Item -LiteralPath "$sdk/lib/Windows_x86_64/x64/nvsdk_ngx_s.lib" `
            -Destination "$target/lib/nvsdk_ngx_s.lib"

      - name: Build experimental NeuralRender add-on
        shell: pwsh
        run: |
          cmake -S native/lsp_neuralrender -B build/lsp_neuralrender -A x64
          cmake --build build/lsp_neuralrender --config Release
          ctest --test-dir build/lsp_neuralrender -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "NeuralRender shader/policy tests failed" }
          $release = "build/lsp_neuralrender/Release"
          $required = @(
            "LSP_NeuralRender.dll",
            "nvngx.dll_lspnr.dll",
            "lspnr_harness.exe",
            "lspnr_hosttest.exe",
            "lspnr_shader_policy_test.exe"
          )
          foreach ($file in $required) {
            $path = Join-Path $release $file
            if (-not (Test-Path -LiteralPath $path) -or (Get-Item -LiteralPath $path).Length -le 0) {
              throw "NeuralRender build output is missing or empty: $path"
            }
          }
          $bundle = "build/native/LSP-NeuralRender"
          New-Item -ItemType Directory -Force $bundle, "$bundle/tools" | Out-Null
          Copy-Item -LiteralPath "$release/LSP_NeuralRender.dll", "$release/nvngx.dll_lspnr.dll" `
            -Destination $bundle
          Copy-Item -LiteralPath "native/lsp_neuralrender/addon.json", `
            "native/lsp_neuralrender/LICENSE", "native/lsp_neuralrender/UPSTREAM.md" `
            -Destination $bundle
          Copy-Item -LiteralPath "$release/lspnr_harness.exe", "$release/lspnr_hosttest.exe", `
            "$release/lspnr_shader_policy_test.exe" `
            -Destination "$bundle/tools"
          Compress-Archive -LiteralPath $bundle -DestinationPath "build/native/LSP-NeuralRender.zip" -Force

      - name: Compile executable
        shell: pwsh
        run: python -m PyInstaller --clean --noconfirm LosslessCompanion.spec

      - name: Verify build output
        shell: pwsh
        run: |
          $executable = Resolve-Path -LiteralPath "dist/LosslessCompanion/LosslessCompanion.exe" -ErrorAction Stop
          $size = (Get-Item -LiteralPath $executable).Length
          if ($size -le 0) {
            throw "Compiled executable is empty"
          }
          $benchmark = Resolve-Path -LiteralPath "dist/LosslessCompanion/_internal/tools/LSBenchmark.exe" -ErrorAction Stop
          if ((Get-Item -LiteralPath $benchmark).Length -le 0) {
            throw "Embedded benchmark executable is empty"
          }
          $bridge = Resolve-Path -LiteralPath "dist/LosslessCompanion/_internal/addons/LSP-ReShade/LSC_ReShadeBridge.dll" -ErrorAction Stop
          if ((Get-Item -LiteralPath $bridge).Length -le 0) {
            throw "Embedded ReShade bridge is empty"
          }
          Resolve-Path -LiteralPath "dist/LosslessCompanion/_internal/addons/LSP-ReShade/addon.json" -ErrorAction Stop | Out-Null
          $neuralBundle = Resolve-Path -LiteralPath "dist/LosslessCompanion/_internal/addons/lsp-neural-render/LSP-NeuralRender.zip" -ErrorAction Stop
          if ((Get-Item -LiteralPath $neuralBundle).Length -le 0) {
            throw "Embedded NeuralRender bundle is empty"
          }
          Write-Host "Built $executable ($size bytes)"

      - name: Publish SHA-256 manifest
        shell: pwsh
        run: |
          $releaseRoot = Resolve-Path -LiteralPath "dist/LosslessCompanion" -ErrorAction Stop
          $manifest = Join-Path $releaseRoot "SHA256SUMS.txt"
          Get-ChildItem -LiteralPath $releaseRoot -Recurse -File |
            Where-Object { $_.FullName -ne $manifest } |
            Sort-Object FullName |
            ForEach-Object {
              $relative = [IO.Path]::GetRelativePath($releaseRoot, $_.FullName).Replace('\', '/')
              $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $relative"
            } | Set-Content -LiteralPath $manifest -Encoding ascii

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: LosslessCompanion-windows-x64-${{ github.sha }}
          path: dist/LosslessCompanion/
          if-no-files-found: error
          retention-days: 30

      - name: Upload experimental NeuralRender build
        uses: actions/upload-artifact@v4
        with:
          name: LSP-NeuralRender-windows-x64-${{ github.sha }}
          path: build/native/LSP-NeuralRender/
          if-no-files-found: error
          retention-days: 30

      - name: Resolve release version
        id: release_version
        shell: pwsh
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          $tag = ""
          $fromCommit = "false"
          if ($env:REF_TYPE -eq "tag" -and $env:REF_NAME -match '^v\d+\.\d+\.\d+$') {
            $tag = $env:REF_NAME
          } elseif (
            $env:REF_TYPE -eq "branch" -and
            $env:REF_NAME -eq "main" -and
            $env:COMMIT_MESSAGE -match '@(?<version>\d+\.\d+\.\d+)(?![\d.])'
          ) {
            $tag = "v$($Matches.version)"
            $fromCommit = "true"
          }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "tag=$tag"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "from_commit=$fromCommit"

      - name: Publish Windows release
        if: steps.release_version.outputs.tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_version.outputs.tag }}
          RELEASE_FROM_COMMIT: ${{ steps.release_version.outputs.from_commit }}
        run: |
          choco install innosetup --no-progress -y
          $version = $env:RELEASE_TAG.TrimStart('v')
          $compiler = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          & $compiler "/DMyAppVersion=$version" installer/LosslessCompanion.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compilation failed"
          }
          $installer = "dist/installer/LosslessCompanion-Setup-x64.exe"
          $checksum = "$installer.sha256"
          $digest = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  LosslessCompanion-Setup-x64.exe" | Set-Content -LiteralPath $checksum -Encoding ascii -NoNewline
          $tag = $env:RELEASE_TAG
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            if ($env:RELEASE_FROM_COMMIT -eq "true") {
              throw "Release $tag already exists; use a new @x.x.x version"
            }
            gh release upload $tag $installer $checksum --clobber
          } else {
            gh release create $tag $installer $checksum --target $env:GITHUB_SHA --generate-notes --title $tag
          }
