name: Build Windows executable

on:
  push:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: true
      release_version:
        type: string
        required: true
    outputs:
      installer_artifact:
        description: Verified installer and addon host artifact ID
        value: ${{ jobs.build.outputs.installer_artifact }}

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: read
    outputs:
      installer_artifact: ${{ steps.updater_artifact.outputs.artifact-id }}
      release_tag: ${{ steps.release_version.outputs.tag }}
      release_from_commit: ${{ steps.release_version.outputs.from_commit }}
      source_sha: ${{ steps.source.outputs.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false

      - name: Record exact build source
        id: source
        shell: pwsh
        run: |
          $sha = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw "Could not resolve the build source" }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "sha=$sha"

      - name: Resolve embedded application version
        shell: pwsh
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          REQUESTED_VERSION: ${{ inputs.release_version }}
        run: |
          $version = "0.0.0-dev"
          if ($env:REQUESTED_VERSION) {
            if ($env:REQUESTED_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid requested release version" }
            $version = $env:REQUESTED_VERSION
          } elseif ($env:REF_TYPE -eq "tag" -and $env:REF_NAME -match '^v(?<version>\d+\.\d+\.\d+)$') {
            $version = $Matches.version
          } elseif (
            $env:REF_TYPE -eq "branch" -and
            $env:REF_NAME -eq "main" -and
            $env:COMMIT_MESSAGE -match '@(?<version>\d+\.\d+\.\d+)(?![\d.])'
          ) {
            $version = $Matches.version
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "LS_COMPANION_VERSION=$version"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: companion/requirements.txt

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r companion/requirements.txt "pyinstaller>=6.10,<7"

      - name: Run application tests
        shell: pwsh
        run: |
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { throw "Python tests failed" }
          node tests/check_javascript.js companion/ui/dashboard.html
          if ($LASTEXITCODE -ne 0) { throw "Dashboard JavaScript validation failed" }
          node tests/test_addon_editor.js
          if ($LASTEXITCODE -ne 0) { throw "Addon editor tests failed" }
          node tests/test_component_updates.js
          if ($LASTEXITCODE -ne 0) { throw "Component update UI tests failed" }
          node tests/test_extension_background.js
          if ($LASTEXITCODE -ne 0) { throw "Browser extension tests failed" }
          node tests/test_notifications.js
          if ($LASTEXITCODE -ne 0) { throw "Notification UI tests failed" }
          node tests/test_profile_navigation.js
          if ($LASTEXITCODE -ne 0) { throw "Profile navigation UI tests failed" }
          node tests/test_profile_icons.js
          if ($LASTEXITCODE -ne 0) { throw "Profile icon UI tests failed" }
          node tests/test_update_lock.js
          if ($LASTEXITCODE -ne 0) { throw "Update maintenance UI tests failed" }
          node tests/test_dashboard_session.js
          if ($LASTEXITCODE -ne 0) { throw "Dashboard session renewal tests failed" }
          node tests/test_dashboard_connection.js
          if ($LASTEXITCODE -ne 0) { throw "Dashboard connection health tests failed" }

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up .NET for the private-settings bootstrap
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build and test private-settings isolation
        shell: pwsh
        run: |
          python scripts/build_runtime_isolation.py
          if ($LASTEXITCODE -ne 0) { throw "Runtime isolation build failed" }
          dotnet build native/runtime_isolation/Fixture/Fixture.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "Isolation fixture build failed" }
          $env:LSC_TEST_RUNTIME_ISOLATION = "1"
          python -m unittest tests.test_managed_runtime -v
          if ($LASTEXITCODE -ne 0) { throw "Private-settings isolation tests failed" }

      - name: Build bundled GPU benchmark
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/native | Out-Null
          cl /nologo /std:c++17 /O2 /EHsc /DUNICODE /D_UNICODE `
            /Fo:build/native/ls_benchmark.obj /Fe:build/native/LSBenchmark.exe `
            benchmark_app/ls_benchmark.cpp `
            d3d11.lib dxgi.lib d3dcompiler.lib user32.lib shell32.lib
          if (-not (Test-Path -LiteralPath build/native/LSBenchmark.exe)) {
            throw "Bundled GPU benchmark was not produced"
          }

      - name: Build bundled ReShade bridge
        shell: pwsh
        run: |
          cmake -S native/reshade_bridge -B build/reshade_bridge -A x64
          cmake --build build/reshade_bridge --config Release
          if (-not (Test-Path -LiteralPath build/native/LSP-ReShade/LSC_ReShadeBridge.dll)) {
            throw "Bundled ReShade bridge was not produced"
          }
          if (-not (Test-Path -LiteralPath build/native/LSP-ReShade/addon.json)) {
            throw "Bundled ReShade bridge manifest was not produced"
          }

      - name: Build adapter reporter
        shell: pwsh
        run: |
          cmake -S native/adapter_report -B build/adapter_report -A x64
          if ($LASTEXITCODE -ne 0) { throw "Adapter reporter configure failed" }
          cmake --build build/adapter_report --config Release
          if ($LASTEXITCODE -ne 0) { throw "Adapter reporter build failed" }
          ctest --test-dir build/adapter_report -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "Adapter reporter lifetime tests failed" }
          if (-not (Test-Path -LiteralPath build/native/LSC-AdapterReport/LSC_AdapterReport.dll)) {
            throw "Adapter reporter was not produced"
          }
          if (-not (Test-Path -LiteralPath build/native/LSC-AdapterReport/LSC_AdapterProbe.exe)) {
            throw "Idle DXGI probe was not produced"
          }
          if (-not (Test-Path -LiteralPath build/native/LSC-AdapterReport/addon.json)) {
            throw "Adapter reporter manifest was not produced"
          }

      - name: Build and test startup window guard
        shell: pwsh
        run: |
          cmake -S native/startup_guard -B build/startup_guard -A x64
          if ($LASTEXITCODE -ne 0) { throw "Startup guard configure failed" }
          cmake --build build/startup_guard --config Release
          if ($LASTEXITCODE -ne 0) { throw "Startup guard build failed" }
          $env:LSC_TEST_NATIVE_STARTUP_GUARD = "1"
          python -m unittest tests.test_startup_guard
          if ($LASTEXITCODE -ne 0) { throw "Startup guard tests failed" }

      - name: Build Companion addon host from pinned FriedSnowman sources
        shell: pwsh
        run: |
          python scripts/build_addon_manager.py
          if ($LASTEXITCODE -ne 0) { throw "Companion addon host build failed" }
          $env:LSC_TEST_ADDON_HOST = "1"
          python -m pytest -q tests/test_addon_host.py tests/test_amd_nr.py tests/test_managed_runtime.py
          if ($LASTEXITCODE -ne 0) { throw "Companion addon host tests failed" }
          & build/native/addon-host-smoke/lsc_routing_test.exe
          if ($LASTEXITCODE -ne 0) { throw "Companion NR routing tests failed" }

      - name: Compile executable
        shell: pwsh
        run: python -m PyInstaller --clean --noconfirm LosslessCompanion.spec

      - name: Verify build output
        shell: pwsh
        run: |
          $executable = Resolve-Path -LiteralPath "dist/LosslessCompanion/LosslessCompanion.exe" -ErrorAction Stop
          $size = (Get-Item -LiteralPath $executable).Length
          if ($size -le 0) {
            throw "Compiled executable is empty"
          }
          $benchmark = Resolve-Path -LiteralPath "dist/LosslessCompanion/_internal/tools/LSBenchmark.exe" -ErrorAction Stop
          Resolve-Path -LiteralPath "dist/LosslessCompanion/_internal/tools/LSC_StartupGuard.dll" -ErrorAction Stop | Out-Null
          Resolve-Path -LiteralPath "dist/LosslessCompanion/_internal/tools/runtime-isolation/LSC_StartupHook.dll" -ErrorAction Stop | Out-Null
          Resolve-Path -LiteralPath "dist/LosslessCompanion/_internal/tools/runtime-isolation/LSC_RuntimeIsolation.dll" -ErrorAction Stop | Out-Null
          Resolve-Path -LiteralPath "dist/LosslessCompanion/_internal/tools/LSC_AdapterProbe.exe" -ErrorAction Stop | Out-Null
          Resolve-Path -LiteralPath "dist/LosslessCompanion/_internal/tools/LSC_AMDNRProbe.exe" -ErrorAction Stop | Out-Null
          Resolve-Path -LiteralPath "dist/LosslessCompanion/_internal/native/amd_neuralrender/runtime.lock.json" -ErrorAction Stop | Out-Null
          if ((Get-Item -LiteralPath $benchmark).Length -le 0) {
            throw "Embedded benchmark executable is empty"
          }
          $bridge = Resolve-Path -LiteralPath "dist/LosslessCompanion/_internal/addons/LSP-ReShade/LSC_ReShadeBridge.dll" -ErrorAction Stop
          if ((Get-Item -LiteralPath $bridge).Length -le 0) {
            throw "Embedded ReShade bridge is empty"
          }
          Resolve-Path -LiteralPath "dist/LosslessCompanion/_internal/addons/LSP-ReShade/addon.json" -ErrorAction Stop | Out-Null
          $neuralBundle = Resolve-Path -LiteralPath "dist/LosslessCompanion/_internal/addons/ls-addon-manager/LSAddonManager-Companion.zip" -ErrorAction Stop
          if ((Get-Item -LiteralPath $neuralBundle).Length -le 0) {
            throw "Embedded Companion addon host bundle is empty"
          }
          Write-Host "Built $executable ($size bytes)"

      - name: Publish SHA-256 manifest
        shell: pwsh
        run: |
          $releaseRoot = Resolve-Path -LiteralPath "dist/LosslessCompanion" -ErrorAction Stop
          $manifest = Join-Path $releaseRoot "SHA256SUMS.txt"
          Get-ChildItem -LiteralPath $releaseRoot -Recurse -File |
            Where-Object { $_.FullName -ne $manifest } |
            Sort-Object FullName |
            ForEach-Object {
              $relative = [IO.Path]::GetRelativePath($releaseRoot, $_.FullName).Replace('\', '/')
              $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $relative"
            } | Set-Content -LiteralPath $manifest -Encoding ascii

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: LosslessCompanion-windows-x64-${{ github.sha }}
          path: dist/LosslessCompanion/
          if-no-files-found: error
          retention-days: 30

      - name: Resolve release version
        id: release_version
        shell: pwsh
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          $tag = ""
          $fromCommit = "false"
          if ($env:REF_TYPE -eq "tag" -and $env:REF_NAME -match '^v\d+\.\d+\.\d+$') {
            $tag = $env:REF_NAME
          } elseif (
            $env:REF_TYPE -eq "branch" -and
            $env:REF_NAME -eq "main" -and
            $env:COMMIT_MESSAGE -match '@(?<version>\d+\.\d+\.\d+)(?![\d.])'
          ) {
            $tag = "v$($Matches.version)"
            $fromCommit = "true"
          }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "tag=$tag"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "from_commit=$fromCommit"

      - name: Build and verify updater installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/package | Out-Null
          $webviewBootstrapper = "build/package/MicrosoftEdgeWebview2Setup.exe"
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile $webviewBootstrapper
          $signature = Get-AuthenticodeSignature -LiteralPath $webviewBootstrapper
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation(,|$)') {
            throw "WebView2 bootstrapper does not have a valid Microsoft signature"
          }
          choco install innosetup --no-progress -y
          $compiler = Get-ChildItem -Path "${env:ProgramFiles(x86)}/Inno Setup*/ISCC.exe", "$env:ProgramFiles/Inno Setup*/ISCC.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $compiler) { throw "Inno Setup compiler was not installed" }
          $version = $env:LS_COMPANION_VERSION -replace '-dev$', ''
          & $compiler "/DMyAppVersion=$version" installer/LosslessCompanion.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }
          $installer = "dist/installer/LosslessCompanion-Setup-x64.exe"
          $digest = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  LosslessCompanion-Setup-x64.exe" | Set-Content -LiteralPath "$installer.sha256" -Encoding ascii -NoNewline
          Copy-Item -LiteralPath build/native/LSAddonManager-Companion.zip -Destination dist/installer/LSAddonManager-Companion.zip
          $hostDigest = (Get-FileHash -LiteralPath dist/installer/LSAddonManager-Companion.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hostDigest  LSAddonManager-Companion.zip" | Set-Content -LiteralPath dist/installer/LSAddonManager-Companion.zip.sha256 -Encoding ascii -NoNewline

      - name: Upload verified updater installer
        id: updater_artifact
        uses: actions/upload-artifact@v4
        with:
          name: LosslessCompanion-updater-${{ github.sha }}
          path: dist/installer/
          if-no-files-found: error

  publish:
    name: Publish Windows release
    needs: build
    if: inputs.release_version == '' && needs.build.outputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified release artifacts
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build.outputs.installer_artifact }}
          merge-multiple: true
          path: release-artifacts

      - name: Verify artifact checksums
        working-directory: release-artifacts
        run: |
          sha256sum --check LosslessCompanion-Setup-x64.exe.sha256
          sha256sum --check LSAddonManager-Companion.zip.sha256

      - name: Publish Windows release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          RELEASE_FROM_COMMIT: ${{ needs.build.outputs.release_from_commit }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
        working-directory: release-artifacts
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [ "$RELEASE_FROM_COMMIT" = true ]; then
              echo "Release $RELEASE_TAG already exists; use a new @x.x.x version" >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" ./*.exe ./*.zip ./*.sha256 --clobber
          else
            gh release create "$RELEASE_TAG" ./*.exe ./*.zip ./*.sha256 --target "$SOURCE_SHA" --generate-notes --title "$RELEASE_TAG"
          fi
