name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r companion/requirements.txt pytest
      - run: python -m pytest -v
      - name: Run JavaScript tests
        shell: pwsh
        run: |
          node tests/check_javascript.js
          if ($LASTEXITCODE -ne 0) { throw "JavaScript validation failed" }
          foreach ($testFile in (Get-ChildItem -LiteralPath tests -Filter 'test_*.js' -File | Sort-Object Name)) {
            node $testFile.FullName
            if ($LASTEXITCODE -ne 0) { throw "JavaScript tests failed: $($testFile.Name)" }
          }
